name: Gerar instalador - Calculadora de Prazos PGE-AC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: calculadora-prazos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calculadora-prazos/package-lock.json

      - run: npm ci

      - name: Testes do núcleo de cálculo
        run: npm test

      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-prazos-instalador
          path: calculadora-prazos/dist_instalador/*.exe
